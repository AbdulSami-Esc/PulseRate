<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PulseRoute Viewer</title>
<style>
:root{--bg:#fafafa;--fg:#1a1a1a;--mut:#777;--line:#bbb;--card:#fff;--bd:#ddd;--ok:#2a7;--bad:#d33;--warn:#e8a317;--rob:#2563eb;--ret:#7c3aed}
@media (prefers-color-scheme:dark){:root{--bg:#161616;--fg:#eee;--mut:#999;--line:#555;--card:#1f1f1f;--bd:#333;--ok:#4c9;--bad:#f55;--warn:#f0b840;--rob:#6ea0ff;--ret:#b794f6}}
*{box-sizing:border-box}
body{margin:0;font:14px system-ui,sans-serif;background:var(--bg);color:var(--fg)}
header{padding:10px 16px;border-bottom:1px solid var(--bd);display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}
h1{font-size:17px;margin:0}header span{color:var(--mut);font-size:12px}
main{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:12px;padding:12px}
@media (max-width:800px){main{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:10px}
svg{width:100%;height:auto;display:block}
.edge{stroke:var(--line);stroke-width:3;cursor:pointer}
.edge.blocked{stroke:var(--bad);stroke-dasharray:6 5}
.edge:hover{stroke:var(--fg)}
.nd{fill:var(--card);stroke:var(--fg);stroke-width:1.5}
.lbl{font-size:11px;fill:var(--fg);text-anchor:middle}
.wt{font-size:10px;fill:var(--mut);text-anchor:middle}
.rob{fill:var(--rob);stroke:var(--card);stroke-width:2}
.rob.STUCK{fill:var(--bad)}.rob.IDLE{fill:var(--mut)}.rob.RETURNING{fill:var(--ret)}
.rt{font-size:9px;fill:#fff;text-anchor:middle;font-weight:600;pointer-events:none}
.fl{font-size:11px;fill:var(--mut)}
.bar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
button{font:inherit;padding:5px 10px;border:1px solid var(--bd);background:var(--card);color:var(--fg);border-radius:6px;cursor:pointer}
button:hover{border-color:var(--fg)}button.on{background:var(--rob);color:#fff;border-color:var(--rob)}
input{width:100%;font:inherit;padding:7px 9px;border:1px solid var(--bd);border-radius:6px;background:var(--bg);color:var(--fg)}
#log{height:210px;overflow:auto;font:12px ui-monospace,monospace;margin-top:8px;white-space:pre-wrap}
#log .e{color:var(--bad)}#log .a{color:var(--warn)}#log .c{color:var(--mut)}#log .g{color:var(--ok)}
h3{font-size:12px;text-transform:uppercase;color:var(--mut);margin:10px 0 4px;letter-spacing:.04em}
#info{font:12px ui-monospace,monospace;line-height:1.6}
.hint{font-size:12px;color:var(--mut);margin-top:6px}
</style>
</head>
<body>
<header><h1>PulseRoute</h1><span>Reroute only what broke. Click a corridor to block or unblock it.</span></header>
<main>
  <div class="card">
    <div class="bar">
      <button id="bTick">Tick</button>
      <button id="bAuto">Auto: off</button>
      <button id="bDemo">Run demo</button>
      <button id="bReset">Reset</button>
    </div>
    <svg id="map" viewBox="0 0 600 380"></svg>
    <div class="hint">Blue = delivering, purple = returning to the Pharmacy, grey = idle, red = stuck. Red dashed corridor = blocked. Orange corridor = risk learned. Number on a corridor = live cost in seconds.</div>
  </div>
  <div class="card">
    <input id="cmd" placeholder="type a command, e.g. help" autocomplete="off">
    <div id="log"></div>
    <h3>Live state</h3>
    <div id="info"></div>
  </div>
</main>

<script>
// ---------- map (same 8-node sample as nodes.csv / edges.csv) ----------
const N = [["Pharmacy",1,60,110],["Junction_A",1,210,110],["Junction_B",1,360,110],["Lab",1,360,230],
           ["ICU_Room_4",1,520,110],["Elevator_1F",1,210,230],["Elevator_2F",2,210,330],["Ward_201",2,420,330]];
const E = [[0,1,10],[1,2,15],[1,3,20],[2,4,12],[3,4,25],[1,5,8],[5,6,30],[6,7,10]];
const ROBOTS = 3, AGING = 10, CONGEST = 5, RISKSCALE = 20, ALPHA = 0.2, DECAY = 0.98, INF = 1e9;
const HOME = 0;   // the Pharmacy: robots start here, wait here, and return here

let adj, robots, queue, idx, tickN, reqN;

// ---------- engine ----------
function init() {
  adj = N.map(() => []);
  E.forEach(([a, b, s]) => {
    adj[a].push({to: b, base: s, w: s, blocked: false, risk: 0});
    adj[b].push({to: a, base: s, w: s, blocked: false, risk: 0});
  });
  idx = new Map(); queue = []; tickN = 0; reqN = 0;
  robots = [];
  for (let i = 0; i < ROBOTS; i++) robots.push({id: i, route: [HOME], pos: 0, dest: HOME, status: "IDLE", returning: false, x: 0, y: 0, tx: 0, ty: 0});
  robots.forEach(r => snap(r, true));
}
const key = (a, b) => a < b ? a + "-" + b : b + "-" + a;
const cur = r => r.route[r.pos];
const findEdge = (a, b) => adj[a].find(e => e.to === b);
const usersOf = (a, b) => [...(idx.get(key(a, b)) || [])];

// reverse index: corridor -> robots whose remaining route uses it
function idxAdd(route, from, id) {
  for (let i = from; i + 1 < route.length; i++) {
    const k = key(route[i], route[i + 1]);
    if (!idx.has(k)) idx.set(k, new Set());
    idx.get(k).add(id);
  }
}
function idxDel(route, from, id) {
  for (let i = from; i + 1 < route.length; i++) {
    const s = idx.get(key(route[i], route[i + 1]));
    if (s) s.delete(id);
  }
}

// Dijkstra (skips blocked edges, reads live weights)
function dijkstra(src, dst) {
  const n = N.length, dist = Array(n).fill(INF), prev = Array(n).fill(-1), vis = Array(n).fill(false);
  dist[src] = 0;
  for (let k = 0; k < n; k++) {
    let u = -1;
    for (let i = 0; i < n; i++) if (!vis[i] && (u < 0 || dist[i] < dist[u])) u = i;
    if (u < 0 || dist[u] >= INF) break;
    vis[u] = true;
    for (const e of adj[u]) {
      if (e.blocked) continue;
      if (dist[u] + e.w < dist[e.to]) { dist[e.to] = dist[u] + e.w; prev[e.to] = u; }
    }
  }
  if (dist[dst] >= INF) return {found: false};
  const path = [];
  for (let c = dst; c !== -1; c = prev[c]) path.push(c);
  return {found: true, time: dist[dst], path: path.reverse()};
}

function assign(r, dest) {
  const res = dijkstra(cur(r), dest);
  if (!res.found) return false;
  idxDel(r.route, r.pos, r.id);
  r.route = res.path; r.pos = 0; r.dest = dest;
  r.returning = false;
  r.status = r.route.length > 1 ? "MOVING" : "IDLE";
  idxAdd(r.route, 0, r.id);
  return true;
}
// local reroute: from the robot's CURRENT node (works for deliveries and for the way home)
function reroute(r) {
  const c = cur(r);
  idxDel(r.route, r.pos, r.id);
  const res = dijkstra(c, r.dest);
  if (res.found) {
    r.route = res.path; r.pos = 0;
    r.status = r.route.length > 1 ? "MOVING" : "IDLE";
    idxAdd(r.route, 0, r.id);
    return true;
  }
  r.route = [c]; r.pos = 0; r.status = "STUCK";
  return false;
}
function advance(r) {
  if (r.status !== "MOVING") return;
  idxDel([r.route[r.pos], r.route[r.pos + 1]], 0, r.id);
  r.pos++;
  if (r.pos === r.route.length - 1) r.status = "IDLE";
}
function blockCorridor(a, b, on) {
  const e1 = findEdge(a, b), e2 = findEdge(b, a);
  if (!e1) return -1;
  e1.blocked = e2.blocked = on;
  if (on) {
    [e1, e2].forEach(e => e.risk = (1 - ALPHA) * e.risk + ALPHA);   // learn
    const hit = usersOf(a, b);
    hit.forEach(id => reroute(robots[id]));
    return hit;
  }
  let rec = 0;
  robots.forEach(r => { if (r.status === "STUCK" && reroute(r)) rec++; });
  return rec;
}
function weightsTick() {
  adj.forEach((list, u) => list.forEach(e => {
    e.risk *= DECAY;
    e.w = e.base + CONGEST * usersOf(u, e.to).length + Math.floor(e.risk * RISKSCALE);
  }));
}

// idle robots that are away from the Pharmacy drive back to it
function sendHome() {
  robots.forEach(r => {
    if (r.status === "IDLE" && cur(r) !== HOME && assign(r, HOME)) r.returning = true;
  });
}
// only an idle robot standing at the Pharmacy can take a request
function dispatchStep() {
  robots.forEach(r => {
    if (r.status !== "IDLE" || cur(r) !== HOME || !queue.length) return;
    queue.sort((p, q) => (p.pri * 100000 + p.arr) - (q.pri * 100000 + q.arr));
    const q = queue.shift();
    if (assign(r, q.dest)) log("R" + r.id + " takes request " + q.id + " (" + q.item + ") -> " + N[q.dest][0], "g");
    else log("Request " + q.id + " unreachable, dropped", "e");
  });
}
function tick() {
  weightsTick();
  queue.forEach(q => { q.wait++; if (q.wait >= AGING && q.pri > 1) { q.pri--; q.wait = 0; } });
  sendHome();
  dispatchStep();
  robots.forEach(advance);
  tickN++;
  render();
}

// ---------- commands (same as the C++ CLI) ----------
const nameId = s => N.findIndex(n => n[0] === s);
function room(s) {
  const id = nameId(s);
  if (id >= 0) return id;
  const hints = N.map(n => n[0]).filter(n => n.toLowerCase().startsWith(s.toLowerCase().slice(0, 2)));
  log("Unknown room '" + s + "'." + (hints.length ? " Did you mean: " + hints.join(" ") : ""), "e");
  return -1;
}
function routeText(r) {
  if (r.status === "STUCK") return "waiting at " + N[cur(r)][0];
  const path = r.route.slice(r.pos).map(i => N[i][0]).join(" -> ");
  return (r.returning && r.status === "MOVING" ? "returning: " : "") + path;
}
const stateOf = r => (r.returning && r.status === "MOVING") ? "RETURNING" : r.status;

function run(line) {
  const w = line.trim().split(/\s+/).filter(Boolean);
  if (!w.length) return;
  log("> " + line, "c");
  const c = w[0];
  if (c === "help") log("dispatch <room> <STAT|URGENT|ROUTINE> <item>\nblock <roomA> <roomB>\nunblock <roomA> <roomB>\ntick [n]\nstatus | robots | risk\nfind <prefix> | reset | demo");
  else if (c === "dispatch") {
    if (w.length < 3) return log("Usage: dispatch <room> <STAT|URGENT|ROUTINE> <item>", "e");
    const d = room(w[1]); if (d < 0) return;
    const pri = {STAT: 1, URGENT: 2, ROUTINE: 3}[w[2].toUpperCase()];
    if (!pri) return log("Priority must be STAT, URGENT or ROUTINE", "e");
    const item = w.slice(3).join(" ") || "Item";
    queue.push({id: reqN, item, dest: d, pri, arr: reqN, wait: 0});
    log("Request " + reqN++ + " queued (" + w[2].toUpperCase() + "): " + item + " -> " + w[1]);
    dispatchStep();   // a robot already waiting at the Pharmacy takes it straight away
  } else if (c === "block" || c === "unblock") {
    if (w.length < 3) return log("Usage: " + c + " <roomA> <roomB>", "e");
    const a = room(w[1]), b = room(w[2]); if (a < 0 || b < 0) return;
    const res = blockCorridor(a, b, c === "block");
    if (res === -1) return log("No corridor between " + w[1] + " and " + w[2], "e");
    if (c === "block") {
      log("ALERT: " + w[1] + " - " + w[2] + " blocked. Affected robots: " + res.length, "a");
      res.forEach(id => log("  re-routed R" + id + ": " + routeText(robots[id]), "a"));
    } else log(w[1] + " - " + w[2] + " reopened. Stuck robots recovered: " + res);
  } else if (c === "tick") {
    const n = parseInt(w[1] || "1", 10);
    if (!(n >= 1)) return log("Usage: tick [number]", "e");
    for (let i = 0; i < n; i++) tick();
    log("[tick " + tickN + "] " + robots.map(r => "R" + r.id + "@" + N[cur(r)][0]).join("  "));
  } else if (c === "status") {
    const k = s => robots.filter(r => stateOf(r) === s).length;
    log("Tick " + tickN + " | waiting: " + queue.length + " | idle " + k("IDLE") + ", delivering " + k("MOVING") + ", returning " + k("RETURNING") + ", stuck " + k("STUCK"));
  } else if (c === "robots") robots.forEach(r => log("R" + r.id + " [" + stateOf(r) + "] " + routeText(r)));
  else if (c === "risk") {
    let any = false;
    adj.forEach((l, a) => l.forEach(e => { if (a < e.to && e.risk > 0.01) { any = true; log(N[a][0] + " - " + N[e.to][0] + ": risk " + e.risk.toFixed(3) + ", weight " + e.w + "s (base " + e.base + "s)"); } }));
    if (!any) log("No risky corridors yet");
  } else if (c === "find") {
    const h = N.map(n => n[0]).filter(n => n.toLowerCase().startsWith((w[1] || "").toLowerCase()));
    log(h.length ? "Matches: " + h.join(" ") : "No rooms start with '" + (w[1] || "") + "'");
  } else if (c === "reset") { init(); $log.innerHTML = ""; log("Reset", "c"); }
  else if (c === "demo") demo();
  else log("Unknown command. Type 'help'.", "e");
  render();
}
function demo() {
  ["dispatch Lab ROUTINE Medicine", "dispatch Ward_201 ROUTINE Supplies", "dispatch ICU_Room_4 STAT Blood_sample",
   "dispatch Lab URGENT Samples", "tick 2", "block Junction_B ICU_Room_4", "tick 1", "robots"].forEach(run);
}

// ---------- drawing ----------
const $map = document.getElementById("map"), $log = document.getElementById("log"), $info = document.getElementById("info");
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, parent) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  (parent || $map).appendChild(e); return e;
}
let edgeEls = [], robEls = [];
function build() {
  $map.innerHTML = "";
  el("text", {x: 8, y: 20, class: "fl"}).textContent = "Floor 1";
  el("text", {x: 8, y: 310, class: "fl"}).textContent = "Floor 2";
  el("line", {x1: 0, y1: 290, x2: 600, y2: 290, stroke: "var(--bd)", "stroke-dasharray": "4 4"});
  edgeEls = E.map(([a, b]) => {
    const ln = el("line", {x1: N[a][2], y1: N[a][3], x2: N[b][2], y2: N[b][3], class: "edge"});
    ln.onclick = () => run((findEdge(a, b).blocked ? "unblock " : "block ") + N[a][0] + " " + N[b][0]);
    const t = el("text", {x: (N[a][2] + N[b][2]) / 2, y: (N[a][3] + N[b][3]) / 2 - 7, class: "wt"});
    return {ln, t, a, b};
  });
  N.forEach(n => { el("circle", {cx: n[2], cy: n[3], r: 13, class: "nd"}); el("text", {x: n[2], y: n[3] + 28, class: "lbl"}).textContent = n[0]; });
  robEls = robots.map(r => {
    const g = el("g", {}); const c = el("circle", {r: 9, class: "rob"}, g);
    el("text", {class: "rt", dy: 3}, g).textContent = "R" + r.id; return {g, c};
  });
}
function snap(r, jump) {
  const n = N[cur(r)];
  r.tx = n[2] + (r.id - 1) * 11; r.ty = n[3] - 22 + (r.id % 2) * 6;
  if (jump) { r.x = r.tx; r.y = r.ty; }
}
function render() {
  robots.forEach(r => snap(r, false));
  edgeEls.forEach(({ln, t, a, b}) => {
    const e = findEdge(a, b), users = usersOf(a, b).length;
    ln.setAttribute("class", "edge" + (e.blocked ? " blocked" : ""));
    ln.style.stroke = !e.blocked && e.risk > 0.05 ? "var(--warn)" : "";
    ln.style.strokeWidth = 3 + Math.min(users, 4);
    t.textContent = e.blocked ? "blocked" : e.w + "s";
  });
  robEls.forEach((o, i) => o.c.setAttribute("class", "rob " + stateOf(robots[i])));
  $info.innerHTML = "tick " + tickN + " | waiting requests: " + queue.length + "<br>" +
    robots.map(r => "R" + r.id + " [" + stateOf(r) + "] " + routeText(r)).join("<br>") +
    (queue.length ? "<br>queue: " + queue.map(q => q.item + "(p" + q.pri + ")").join(", ") : "");
}
function log(msg, cls) {
  const d = document.createElement("div"); d.className = cls || ""; d.textContent = msg;
  $log.appendChild(d); $log.scrollTop = $log.scrollHeight;
}
// smooth movement: every frame, each robot slides toward its target node
function frame() {
  robots.forEach((r, i) => {
    r.x += (r.tx - r.x) * 0.12; r.y += (r.ty - r.y) * 0.12;
    robEls[i].g.setAttribute("transform", "translate(" + r.x + "," + r.y + ")");
  });
  requestAnimationFrame(frame);
}

// ---------- wiring ----------
let timer = null;
document.getElementById("bTick").onclick = () => { tick(); log("[tick " + tickN + "] " + robots.map(r => "R" + r.id + "@" + N[cur(r)][0]).join("  ")); };
document.getElementById("bAuto").onclick = e => {
  if (timer) { clearInterval(timer); timer = null; e.target.textContent = "Auto: off"; e.target.classList.remove("on"); }
  else { timer = setInterval(tick, 900); e.target.textContent = "Auto: on"; e.target.classList.add("on"); }
};
document.getElementById("bDemo").onclick = demo;
document.getElementById("bReset").onclick = () => run("reset");
document.getElementById("cmd").addEventListener("keydown", e => { if (e.key === "Enter") { run(e.target.value); e.target.value = ""; } });

init(); build(); render(); frame();
log("PulseRoute ready. Type help, or click Run demo.", "c");
</script>
</body>
</html>
